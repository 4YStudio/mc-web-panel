<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <title>MC Web Panel - 卷轴工坊市场</title>
    <meta name="description" content="浏览、搜索和获取 MC Web Panel 自动化卷轴脚本，免侵入提升你的 Minecraft 服务器管理体验。">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/landing.css?v=2">
    <link rel="stylesheet" href="css/market.css?v=2">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.25);
        }
        .market-hero-badge {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border-color: rgba(139, 92, 246, 0.3);
        }
        .filter-btn.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }
    </style>
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="container nav-container">
            <a href="./index.html" class="nav-brand">
                <div class="nav-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);">
                    <i class="fa-solid fa-scroll"></i>
                </div>
                <span class="nav-brand-text">MC Web Panel</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="./index.html#features">特性</a>
                <a href="./market.html">
                    <i class="fa-solid fa-puzzle-piece"></i> 插件市场
                </a>
                <a href="./scrolls-market.html" class="active" style="color: #a78bfa;">
                    <i class="fa-solid fa-scroll"></i> 卷轴市场
                </a>
                <a href="./scrolls-guide/" class="nav-link-doc">
                    <i class="fa-solid fa-book-journal-whills"></i> 卷轴开发文档
                </a>
                <a href="https://github.com/4ystudio/mc-web-panel" target="_blank" class="nav-link-github">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero / Header Area -->
    <header class="market-hero">
        <div class="market-hero-bg">
            <div class="market-hero-grid"></div>
            <div class="market-hero-glow" style="background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, rgba(0,0,0,0) 70%);"></div>
        </div>
        <div class="container market-hero-content">
            <div class="market-hero-badge">
                <i class="fa-solid fa-scroll"></i>
                <span>官方与社区卷轴市场 (Scroll Market)</span>
            </div>
            <h1 class="market-hero-title">全核心通用的自动化脚本</h1>
            <p class="market-hero-desc">免安装服务端 Mod/Plugin、永不崩服、零侵入式的控制台自动化脚本库。一键导入，毫秒级热生效！</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="market-main container">
        <!-- Controls -->
        <section class="controls-panel">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="搜索卷轴名称、功能描述或作者..." aria-label="搜索卷轴">
            </div>
            <div class="filters-and-sort">
                <div class="category-filters" id="categoryFilters">
                    <button class="filter-btn active" data-category="all">全部</button>
                    <button class="filter-btn" data-category="tools">系统运维</button>
                    <button class="filter-btn" data-category="interactive">玩家互动</button>
                    <button class="filter-btn" data-category="utility">实用工具</button>
                </div>
                <div class="sort-wrapper">
                    <label for="sortSelect" class="sort-label">排序方式</label>
                    <div class="select-container">
                        <select id="sortSelect">
                            <option value="default">默认推荐</option>
                            <option value="name">按名称 (A-Z)</option>
                            <option value="category">按分类排序</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-chevron"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading Indicator / Empty State -->
        <div class="market-status" id="marketStatus" style="display: none;">
            <div class="empty-state">
                <i class="fa-solid fa-scroll empty-icon" style="color: #a78bfa;"></i>
                <p>未找到符合条件的卷轴脚本</p>
                <button class="btn btn-outline btn-sm" id="resetFiltersBtn">重置过滤条件</button>
            </div>
        </div>

        <!-- Scrolls Grid -->
        <section class="plugins-grid-container" id="scrollsGrid">
            <!-- Cards will be populated by JavaScript -->
        </section>
    </main>

    <!-- Scroll Details Dialog -->
    <dialog class="details-modal" id="detailsModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn" aria-label="关闭">&times;</button>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </dialog>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="nav-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);">
                        <i class="fa-solid fa-scroll"></i>
                    </div>
                    <span class="footer-brand-text">MC Web Panel</span>
                </div>
                <div class="footer-links">
                    <a href="./index.html#features">特性</a>
                    <a href="./market.html">插件市场</a>
                    <a href="./scrolls-market.html">卷轴市场</a>
                    <a href="./scrolls-guide/">卷轴开发文档</a>
                    <a href="https://github.com/4ystudio/mc-web-panel" target="_blank">GitHub</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>Released under the <a href="https://github.com/4ystudio/mc-web-panel/blob/main/LICENSE" target="_blank">MIT License</a></p>
                <p>Made with <i class="fa-solid fa-heart" style="color: #a78bfa;"></i> by <a href="https://github.com/4ystudio" target="_blank">4ystudio</a></p>
            </div>
        </div>
    </footer>

    <script src="js/landing.js?v=2"></script>
    <script src="js/scrolls-market.js?v=2"></script>
</body>
</html>
